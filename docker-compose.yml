name: mktdash-identity

services:
  postgres:
    image: postgres:17-alpine
    container_name: mktdash-identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mktdash_identity_owner
      POSTGRES_PASSWORD: local_dev_owner_password
      POSTGRES_DB: mktdash_identity
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mktdash_identity_owner -d mktdash_identity" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: mktdash-identity-redis
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --requirepass
      - local_dev_redis_password
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a local_dev_redis_password --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
