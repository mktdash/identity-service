services:
  postgres:
    image: postgres:18-alpine
    container_name: identity-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_MIGRATION_USER:?DATABASE_MIGRATION_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      APP_ROLE_NAME: ${DATABASE_USER:?DATABASE_USER is required}
      APP_ROLE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DOCKER_POSTGRES_BIND_HOST:-127.0.0.1}:${DATABASE_PORT:?DATABASE_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_MIGRATION_USER} -d ${DATABASE_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: identity-service-redis
    restart: unless-stopped
    environment:
      TZ: UTC
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${DOCKER_REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
